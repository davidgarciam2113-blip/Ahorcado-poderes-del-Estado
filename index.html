<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ahorcado</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    text-align: center;
    padding: 30px;
}

.container {
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px #ccc;
}

h1 {
    color: #1f3c88;
}

#ahorcado {
    font-size: 80px;
    height: 100px;
    margin: 20px;
}

#palabra {
    font-size: 40px;
    letter-spacing: 12px;
    margin: 25px;
    font-weight: bold;
}

#letras {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    margin: 5px;
    padding: 10px 14px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #1f3c88;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3156c9;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

#mensaje {
    font-size: 22px;
    font-weight: bold;
    margin: 20px;
}
</style>

</head>

<body>

<div class="container">

<h1>⚖️ El Ahorcado</h1>

<div id="ahorcado">🙂</div>

<div id="palabra"></div>

<div id="letras"></div>

<div id="mensaje"></div>

<button id="nuevoJuego">Nueva partida</button>

</div>


<script>

const palabras = [
    "EJECUTIVO",
    "LEGISLATIVO",
    "JUDICIAL"
];


let palabraActual = "";
let letrasAdivinadas = [];
let errores = 0;

const maxErrores = 6;


function iniciarJuego() {

    palabraActual = palabras[Math.floor(Math.random() * palabras.length)];

    letrasAdivinadas = [];

    errores = 0;

    document.getElementById("mensaje").innerHTML = "";

    crearBotones();

    actualizarPantalla();

}



function crearBotones() {

    const zonaLetras = document.getElementById("letras");

    zonaLetras.innerHTML = "";

    const letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";


    for (let letra of letras) {

        const boton = document.createElement("button");

        boton.textContent = letra;

        boton.addEventListener("click", function() {

            comprobarLetra(letra);

            boton.disabled = true;

        });


        zonaLetras.appendChild(boton);

    }

}



function comprobarLetra(letra) {


    if (palabraActual.includes(letra)) {

        letrasAdivinadas.push(letra);

    } else {

        errores++;

    }


    actualizarPantalla();

}




function actualizarPantalla() {


    let palabraMostrada = "";


    for (let letra of palabraActual) {

        if (letrasAdivinadas.includes(letra)) {

            palabraMostrada += letra + " ";

        } else {

            palabraMostrada += "_ ";

        }

    }


    document.getElementById("palabra").innerHTML = palabraMostrada;



    const dibujos = [
        "🙂",
        "😐",
        "😟",
        "😨",
        "😱",
        "💀",
        "☠️"
    ];


    document.getElementById("ahorcado").innerHTML = dibujos[errores];



    if (!palabraMostrada.includes("_")) {

        document.getElementById("mensaje").innerHTML =
        "🎉 ¡Has encontrado la palabra!";

        bloquearLetras();

    }



    if (errores >= maxErrores) {

        document.getElementById("mensaje").innerHTML =
        "❌ Fin del juego";

        bloquearLetras();

    }

}




function bloquearLetras() {

    document.querySelectorAll("#letras button").forEach(function(boton){

        boton.disabled = true;

    });

}




document.getElementById("nuevoJuego").addEventListener("click", function(){

    iniciarJuego();

});



iniciarJuego();

</script>


</body>
</html>
